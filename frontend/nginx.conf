# =====================================================================
# nginx.conf — how the container serves the built Angular files
# =====================================================================
#
# WHAT NGINX IS
# A web server: a program that listens for requests and hands back files. The
# Angular application is just files, so this is all that is needed to serve it
# — no Node.js, no application process.
#
# WHY THIS FILE EXISTS AT ALL
# Two things a plain file server gets wrong for a single-page application:
#
#   1. Deep links. Addresses like /campaigns are not files on disk; Angular
#      creates them in the browser. Asking the server for /campaigns directly
#      (a refresh, a bookmark, a shared link) would return 404 without the
#      try_files rule below. This catches nearly everyone the first time.
#
#   2. Caching. index.html and config.json must never be cached, or a returning
#      visitor keeps loading the previous release and talking to the previous
#      backend. Everything else should be cached for a year, because those
#      filenames change whenever their contents do.
# =====================================================================

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version in responses. Free, and it removes one
    # hint an attacker would otherwise use to look up known vulnerabilities.
    server_tokens off;

    # Compress text responses. Typically cuts the JavaScript download by about
    # 70 percent, which is the single biggest thing affecting first load.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # ---------------------------------------------------------------
    # Security headers
    #
    # These mirror what .htaccess sets on Hostinger, so the application
    # behaves identically whichever way it is served. There is deliberately
    # no HSTS here: this container usually sits behind something else that
    # terminates TLS, and that layer should own the decision.
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), payment=()" always;

    # ---------------------------------------------------------------
    # Never cache these two.
    #
    # index.html names the current JavaScript bundles; config.json names the
    # backend. A cached copy of either means a visitor silently runs the
    # previous release, which is a genuinely baffling thing to debug.
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires    off;
    }

    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires    off;
    }

    # ---------------------------------------------------------------
    # Cache the fingerprinted assets aggressively.
    #
    # Their filenames contain a hash of their contents, so a stale file can
    # never be served for new content — the new content has a different name.
    # That makes a one-year cache safe rather than reckless.
    # ---------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # A plain endpoint for container health checks. Returns instantly and
    # touches nothing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------------------------------------------------------
    # The single-page application rule.
    #
    # "Try to serve the exact file. Failing that, try it as a directory.
    #  Failing that, hand over index.html and let Angular route it."
    #
    # This is what makes refreshing on /campaigns work.
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
